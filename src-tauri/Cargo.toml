[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-autostart = "2.5"
tauri-plugin-notification = "2.3"
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["full"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
tokio-tungstenite = "0.29.0"
tokio-util = "0.7"
futures-util = "0.3"
url = "2"
libc = "0.2"
